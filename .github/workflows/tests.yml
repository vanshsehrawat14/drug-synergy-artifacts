name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q synergy_artifacts
      - run: python -m synergy_artifacts.smoke --output results/neural/runs/ci_smoke
      - run: python manuscript/scripts/check_numbers.py --resolution results/interaction_analysis/resolution
