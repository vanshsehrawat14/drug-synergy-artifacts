[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs622-synergy"
version = "0.1.0"
license = { file = "LICENSE" }
authors = [{name = "Vanshdeep Sehrawat"}, {name = "Kingsley Ukandu"}, {name = "Sharlene Kim"}]
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.2", "scipy>=1.14", "scikit-learn>=1.5", "torch>=2.2", "pyarrow>=18"]

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]
research = ["mpmath>=1.3", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["cs622*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Repository = "https://github.com/vanshsehrawat14/drug-synergy-artifacts"
